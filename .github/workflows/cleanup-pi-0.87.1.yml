name: cleanup-multipass-pi-0.87.1

on:
  push:
    branches:
      - cleanup/pi-0.87.1

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/pi-0.87.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm test
      - name: Commit refreshed lockfile when needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile for Pi 0.87.1"
          git push
