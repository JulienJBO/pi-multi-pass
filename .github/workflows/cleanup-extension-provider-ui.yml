name: cleanup-extension-provider-ui

on:
  push:
    branches:
      - cleanup/extension-provider-ui

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/extension-provider-ui
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
